version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/tabbify
      - DB_USER=tabbify
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PATH=/data/recordings
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    volumes:
      - recordings:/data/recordings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tabbify-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabbify
      POSTGRES_USER: tabbify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabbify -d tabbify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabbify-net

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webApp/build/dist/js/productionExecutable:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - tabbify-net

volumes:
  pgdata:
    driver: local
  recordings:
    driver: local
  certbot-etc:
    driver: local

networks:
  tabbify-net:
    driver: bridge
