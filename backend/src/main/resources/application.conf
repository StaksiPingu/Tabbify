server {
  host = "0.0.0.0"
  host = ${?SERVER_HOST}
  port = 8080
  port = ${?SERVER_PORT}
  allowedOrigins = ["*"]
}

database {
  url = "jdbc:postgresql://localhost:5432/tabbify"
  url = ${?DB_URL}
  user = "tabbify"
  user = ${?DB_USER}
  password = "tabbify_secret"
  password = ${?DB_PASSWORD}
  driver = "org.postgresql.Driver"
  maxPoolSize = 10
}

jwt {
  secret = "super-secret-change-in-production"
  secret = ${?JWT_SECRET}
  issuer = "tabbify"
  audience = "tabbify-users"
  expiresInMs = 604800000
}

storage {
  path = "/data/recordings"
  path = ${?STORAGE_PATH}
  maxFileSizeMb = 100
}
